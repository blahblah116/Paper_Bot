# paperbot example config. Copy it to config.yaml and fill in your values (config.yaml is gitignored).
# paperbot 설정 예시 — config.yaml로 복사해 값을 채운다 (config.yaml은 gitignore).
#   cp config.example.yaml config.yaml

topics:
  # Every filter (subject, venues, years, citations) lives here — no code changes needed.
  # 주제·학회·연도·인용 수 필터는 전부 여기서 조절한다 (코드 수정 없이).
  - name: "graph-transformer"
    channel: "#papers-gt"           # Slack channel for this topic (default: slack.channel) / 이 topic의 채널 (생략 시 slack.channel)
    # Natural-language interest statement. The relevance filter (embedding + LLM judge) scores papers against it.
    # Write it in English — the embedding model (all-MiniLM-L6-v2) is English-centric.
    # 관심사 서술 — relevance 필터(임베딩·LLM judge)의 기준. 임베딩 모델이 영어 중심이라 영어로 쓴다.
    interest: >
      Graph Transformer and Graph Mamba family architectures: positional and
      structural encodings, graph generalization of attention, long-range
      dependencies, and scalability. Exclude plain GNN application papers.
    sources:
      semantic_scholar:
        query: '"graph transformer" | "graph mamba"'   # S2 bulk-search syntax / S2 bulk 검색 문법
        venues: ["ICLR", "NeurIPS", "ICML", "KDD"]   # empty list = no venue filter / 비면 venue 필터 없음
        year: "2020-"                # "2024" | "2024-2026" | "2024-"
        min_citations: 5             # citation floor / 인용 수 하한
        # sort: "recency" (default) | "citations" — top-cited first; the bot skips papers it already knows and keeps paging
        # sort: "recency"(기본, 최신순) | "citations"(인용순 — 이미 아는 논문은 건너뛰고 페이지를 넘김)
      arxiv:
        enabled: true                # also pull preprints / 프리프린트도 받을지
        query: 'cat:cs.LG AND (abs:"graph transformer" OR abs:"graph mamba")'   # arXiv search syntax / arXiv 검색 문법
    # quota: {s2: 2, arxiv: 3}      # per-topic override of the global quota / 이 topic만 쿼터 덮어쓰기

  - name: "cad-reverse-engineering"
    channel: "#papers-cad"
    interest: >
      B-rep based CAD reverse engineering, CAD reconstruction/generation,
      representation learning for solid models.
    sources:
      semantic_scholar:
        query: '"B-rep" | "CAD reconstruction" | "CAD generation"'
        venues: ["CVPR", "ICCV", "ECCV", "SIGGRAPH"]
        year: "2024-"
        min_citations: 0             # 0 for niche fields; the relevance filter keeps quality / 니치 분야는 0 (필터가 품질을 거름)
      arxiv:
        enabled: true
        query: '(cat:cs.CV OR cat:cs.GR) AND (abs:"B-rep" OR abs:"CAD reconstruction")'

fetch:
  max_results_per_query: 10   # candidates per source per topic / 소스별 검색 후보 수
  arxiv_lookback_days: 14     # only arXiv submissions from the last N days / 최근 N일 제출분만
  s2_lookback_days: 0         # 0 = off; let each topic's `year` bound the time range (recommended) / 0 = 비활성, topic year에 위임(권장)
  s2_max_pages_per_run: 3     # citation-sorted topics only: bulk pages (1000 each) to scan per run / 인용순 topic 전용
  unpaywall_email: ""         # your email for Unpaywall OA lookup when a publisher blocks the PDF (empty = off) / Unpaywall 조회용 이메일 (비우면 미사용)

quota:
  # Daily publish cap per topic and source. 0 = unlimited. Extra papers wait in the pending queue (FIFO).
  # 하루 topic×소스별 발행 상한. 0 = 무제한. 초과분은 pending 대기열(FIFO)에서 다음 날 먼저 발행.
  s2_per_topic: 3
  arxiv_per_topic: 2
  pending_max_age_days: 30    # drop pending papers older than this; 0 = never / 이보다 오래 대기한 pending 폐기, 0 = 무제한

filter:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_device: "cpu"     # keep the GPU for the summary model / GPU는 요약 모델 전용
  embedding_threshold: 0.25   # cosine(interest, title+abstract) floor / cosine 하한
  llm_judge: true             # re-score survivors with the LLM (0-10) / 임베딩 통과분을 LLM으로 재채점
  judge_threshold: 6          # 0-10 / 점수 하한

llm:
  base_url: "http://localhost:11434/v1"   # Ollama, OpenAI-compatible endpoint / Ollama OpenAI 호환 엔드포인트
  model: "qwen3.8:27b"        # fits two 16GB GPUs; use a ~9b model on one GPU / 16GB GPU 2장 기준, 1장이면 9b급
  num_ctx: 65536              # must match the server's OLLAMA_CONTEXT_LENGTH / 서버 OLLAMA_CONTEXT_LENGTH와 일치
  max_input_chars: 150000     # paper text sent to the model (fits in num_ctx) / 본문 입력 상한
  max_output_tokens: 8192     # summary length cap / 요약 출력 상한
  temperature: 0.3
  language: "ko"              # summary language / 요약 언어

slack:
  channel: "#papers"          # default channel — invite the bot first / 기본 채널 (봇 초대 필수)
  attach_figure: true         # attach key figures to the thread (needs files:write) / 대표 figure 첨부 (files:write 스코프)
  max_figures: 3              # figures per paper / 논문당 figure 수
  dry_run: false              # true = print to stdout instead of posting (no token needed) / 전송 대신 stdout (토큰 불필요)
  # The bot token comes from the environment variable SLACK_BOT_TOKEN — never put it here.
  # 봇 토큰은 환경변수 SLACK_BOT_TOKEN으로 — config에 넣지 않는다.

storage:
  db_path: "./data/papers.db" # state DB (sqlite); use an absolute path for a NAS / 처리 이력 DB (NAS는 절대 경로)
  pdf_dir: "./data/pdfs"      # PDF scratch dir / PDF 임시 저장
  keep_pdfs: false            # delete PDFs after summarizing / 요약 후 PDF 삭제
